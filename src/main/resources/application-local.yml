# 로컬 개발 — 접속 정보는 .env 로 주입한다 (`.env.example` 참고)
db:
  schema: ${DB_SCHEMA:petkok_local}

spring:
  datasource:
    # 포트 5433 은 Postgres.app 의 PostgreSQL 17 이다 (운영 Supabase 17.x 와 메이저 일치).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/petkok}
    username: ${DB_USERNAME:root}
    # 기본값을 두지 않는다 — pg_hba 의 host 라인이 scram-sha-256 이라
    # 아무 더미 값이나 넣으면 "비밀번호 틀림"으로만 보여 원인 파악이 늦어진다.
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789abcdef}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: info
