# db.schema — 프로파일별 스키마의 단일 출처.
#   local → petkok_local · dev → petkok_dev · prod → petkok_prod (각 application-{profile}.yml)
#   Flyway 와 Hibernate 양쪽이 모두 이 값을 참조한다. 한쪽만 지정하면
#   테이블은 지정 스키마에 생기는데 조회는 search_path 를 따라가 "테이블이 없다"로 나타난다.
#   여기 기본값을 두지 않는 것은 의도적이다 — 프로파일이 값을 빠뜨리면 기동 시점에 즉시 실패한다.
spring:
  application:
    name: petkok-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # 스키마 소유는 Flyway. JPA는 검증만.
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${db.schema}
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    schemas: ${db.schema}         # 마이그레이션 대상 스키마 (없으면 생성)
    default-schema: ${db.schema}  # 마이그레이션 실행 중 search_path
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TTL:1800000}       # 30분
  refresh-token-validity-ms: ${JWT_REFRESH_TTL:1209600000}  # 14일

# Kakao OAuth2 — 커스텀 플로우다. 클라이언트가 받은 인가코드를 서버가 넘겨받아
# kauth.kakao.com/oauth/token 으로 교환한다 (spring-security-oauth2-client 의 리다이렉트
# 로그인이 아니다). 따라서 서버가 필요한 값은 아래 3개뿐이다.
# R2 와 같이 더미 기본값을 둔다 — auth 구현(REQ-07 Phase 4) 전까지 기동을 막지 않기 위해서다.
kakao:
  # 콘솔의 4개 앱 키 중 REST API 키. 네이티브/JavaScript/Admin 키가 아니다.
  client-id: ${KAKAO_CLIENT_ID:dummy}
  # 콘솔 → 카카오 로그인 → 보안 에서 "사용함"일 때만 필수.
  # 비어 있으면 토큰 교환 요청에서 파라미터 자체를 생략한다 (빈 값을 실어 보내면 거부된다).
  client-secret: ${KAKAO_CLIENT_SECRET:}
  # ⚠️ 서버는 리다이렉트를 받지 않지만 토큰 교환에는 이 값이 필요하다.
  #    콘솔 등록값 · 클라이언트가 인가 요청에 쓴 값과 문자 단위로 같아야 한다.
  #    다르면 KOE006 / invalid_grant 로 떨어진다.
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/kakao/callback}

r2:
  account-id: ${R2_ACCOUNT_ID:dummy}
  access-key: ${R2_ACCESS_KEY:dummy}
  secret-key: ${R2_SECRET_KEY:dummy}
  bucket: ${R2_BUCKET:petkok}
  endpoint: ${R2_ENDPOINT:https://dummy.r2.cloudflarestorage.com}
  public-base-url: ${R2_PUBLIC_BASE_URL:https://cdn.example.com}

management:
  endpoints:
    web:
      exposure:
        include: health
